[package]
name = "worldrunner-render-program"
description = "Format-neutral shader program runtime: layouts, variants, render state and draws, with a default-off Unity adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The Unity adapter, `render_program::unity`. The neutral runtime does not depend on it.
unity = ["dep:worldrunner-unity-serialized"]
# Synthetic player shaders built from WGSL (`unity::synthetic`), for tests of this crate and of
# its consumers. They are Unity records, so the feature implies `unity`.
test-support = ["unity", "naga/spv-out"]

[dependencies]
worldrunner-render-gpu = { path = "../render-gpu" }
worldrunner-render-post = { path = "../render-post" }
worldrunner-unity-serialized = { path = "../unity-serialized", optional = true }
# naga is the front end wgpu runs; parsing a stage here names a failure before wgpu sees it.
naga = { version = "30.0.0", features = ["spv-in", "wgsl-in"] }
# `naga-ir` accepts the parsed module as a shader source.
wgpu = { workspace = true, features = ["naga-ir"] }
blake3.workspace = true
thiserror.workspace = true

[dev-dependencies]
worldrunner-unity-serialized = { path = "../unity-serialized" }
worldrunner-render-gpu = { path = "../render-gpu", features = ["test-support"] }
naga = { version = "30.0.0", features = ["spv-in", "spv-out", "wgsl-in"] }
pollster.workspace = true

[lints]
workspace = true

# The suites that build Unity records run only with the `unity` feature, and the program suite
# also draws offscreen with the synthetic shaders of `test-support`.
[[test]]
name = "program"
path = "tests/program/main.rs"
required-features = ["unity", "test-support"]

[[test]]
name = "variant"
path = "tests/variant.rs"
required-features = ["unity"]
