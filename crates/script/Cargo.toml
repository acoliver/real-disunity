[package]
name = "worldrunner-script"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[dependencies]
mlua = { version = "0.10", features = ["lua54", "vendored", "send"] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
lua-resume = { git = "https://github.com/acoliver/lua-resume", rev = "885e4791a97d1c16f6aa6aca8b79c39a8df3fad6" }
lua-resume-debug = { git = "https://github.com/acoliver/lua-resume", rev = "885e4791a97d1c16f6aa6aca8b79c39a8df3fad6" }

# The CI profiles run no separate complexity pass, so strict lint enforces the clippy.toml limits.
[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
struct_excessive_bools = "warn"
