name: PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an older run of the same pull request or of main, so a burst of
# merges checks only the newest commit. Manual dispatches never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 2

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
      scope: ${{ steps.classify.outputs.scope }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      # The classifier comes from the base commit so a pull request cannot change the rule
      # that decides whether its own code is built. Any doubt selects the full build.
      - id: classify
        name: Classify the change
        env:
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          set -uo pipefail
          full() {
            printf 'docs_only=false\nscope=full\n' >> "$GITHUB_OUTPUT"
            echo "full build: $1"
            exit 0
          }
          # Runs on main can be superseded by a newer push, so each one checks the whole tree.
          [ "$EVENT_NAME" = pull_request ] || full "$EVENT_NAME checks the whole tree"
          git rev-parse --verify --quiet HEAD^1 > /dev/null || full "no parent commit"
          git rev-parse --verify --quiet HEAD^2 > /dev/null || full "no merge commit"
          git show HEAD^1:.github/scripts/ci_changes.py > "$RUNNER_TEMP/ci_changes.py" 2> /dev/null \
            || full "base commit has no classifier"
          result="$RUNNER_TEMP/classify.out"
          GITHUB_OUTPUT="$result" python3 "$RUNNER_TEMP/ci_changes.py" classify --base HEAD^1 --head HEAD
          docs_only=$(sed -n 's/^docs_only=//p' "$result" | tail -n 1)
          scope=$(sed -n 's/^scope=//p' "$result" | tail -n 1)
          # A base classifier that predates scopes reports only docs_only.
          if [ -z "$scope" ]; then
            if [ "$docs_only" = true ]; then scope=docs; else scope=full; fi
          fi
          case "$scope" in docs|csharp|full) ;; *) full "unknown scope '$scope'" ;; esac
          printf 'docs_only=%s\nscope=%s\n' "$([ "$scope" = docs ] && echo true || echo false)" "$scope" >> "$GITHUB_OUTPUT"
      - name: Test the CI scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  docs:
    name: documentation checks
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Whitespace errors
        if: github.event_name != 'workflow_dispatch'
        run: git diff --check HEAD^1 HEAD
      - name: Links and anchors in changed Markdown
        if: github.event_name != 'workflow_dispatch'
        run: python3 .github/scripts/ci_changes.py check-docs --base HEAD^1 --head HEAD

  cpu:
    name: cpu and managed (ubuntu-latest)
    needs: classify
    if: needs.classify.outputs.scope == 'csharp' || needs.classify.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: linux
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: CPU libraries, tools, and facade without default features
        run: cargo xtask ci-cpu
      - name: Required .NET build, native host, and managed lifecycle tests
        run: cargo xtask ci-managed
      - name: Verify that no Markdown file is a build input
        run: python3 .github/scripts/ci_changes.py markdown-inputs --target target/validation --root .

  gpu-static:
    name: gpu static checks
    needs: classify
    if: needs.classify.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: ./.github/actions/lavapipe
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lavapipe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint, complexity, check, build and doctests for the GPU packages
        env:
          WGPU_BACKEND: vulkan
          WGPU_ADAPTER_NAME: llvmpipe
        run: xvfb-run --auto-servernum --server-args="-screen 0 8192x8192x24 -nolisten tcp" cargo xtask ci-gpu-static
      - name: Verify that no Markdown file is a build input
        run: python3 .github/scripts/ci_changes.py markdown-inputs --target target/validation --root .

  gpu-tests:
    name: gpu tests (${{ matrix.shard }}/8)
    needs: classify
    if: needs.classify.outputs.scope == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: ./.github/actions/lavapipe
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lavapipe
          save-if: false
      - name: Required GPU tests, one eighth of the full suite
        env:
          WGPU_BACKEND: vulkan
          WGPU_ADAPTER_NAME: llvmpipe
        run: xvfb-run --auto-servernum --server-args="-screen 0 8192x8192x24 -nolisten tcp" cargo xtask ci-gpu-shard ${{ matrix.shard }}/8

  gpu-csharp:
    name: gpu tests of C# consumers
    needs: classify
    if: needs.classify.outputs.scope == 'csharp'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: ./.github/actions/lavapipe
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lavapipe
          save-if: false
      # A change limited to csharp/ leaves every Rust source unchanged, so only the packages
      # that build or read the C# projects can observe it. xtask policy keeps that list complete.
      - name: GPU-required tests of the packages that consume csharp/
        env:
          WGPU_BACKEND: vulkan
          WGPU_ADAPTER_NAME: llvmpipe
        run: xvfb-run --auto-servernum --server-args="-screen 0 8192x8192x24 -nolisten tcp" cargo xtask ci-gpu-csharp

  gate:
    name: PR gate
    needs: [classify, docs, cpu, gpu-static, gpu-tests, gpu-csharp]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      # Each scope names the build jobs that must succeed; every other build job must be
      # skipped. A skipped, cancelled or failed required job never counts as a pass.
      - name: Evaluate the required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 .github/scripts/ci_gate.py

  report:
    name: report
    needs: [classify, docs, cpu, gpu-static, gpu-tests, gpu-csharp]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Open, update or close the CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          WORKFLOW: PR
          SCOPE: ${{ needs.classify.outputs.scope }}
        run: python3 .github/scripts/ci_report.py
