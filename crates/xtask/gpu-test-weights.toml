# Measured run time, in seconds, of the slowest `ci-gpu` tests on the hosted lavapipe runner.
# `ci-gpu-shard` deals the heaviest tests first, each to the shard with the least work so far.
# Tests not listed weigh `default_test`; harness-free binaries not listed weigh `default_unit`.
# A wrong or stale value only unbalances the shards: every test still runs exactly once.
# Refresh from a shard log when `cargo xtask ci-gpu-plan 8` shows one shard far above the others.

default_test = 1
default_unit = 60

[units]
"test callback_failure" = 50
"test live_window" = 65
"test play_window" = 120

