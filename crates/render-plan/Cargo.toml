version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
simulation = ["dep:worldrunner-world-simulation"]

[dependencies]
worldrunner-camera = { path = "../camera" }
