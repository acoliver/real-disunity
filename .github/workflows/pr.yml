name: PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_BUILD_JOBS: 2

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      # The classifier comes from the base commit so a pull request cannot change the rule
      # that decides whether its own code is built. Any doubt selects the full build.
      - id: classify
        name: Classify the change
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -uo pipefail
          full() {
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "full build: $1"
            exit 0
          }
          [ "$EVENT_NAME" = workflow_dispatch ] && full "manual dispatch"
          git rev-parse --verify --quiet HEAD^1 > /dev/null || full "no parent commit"
          if [ "$EVENT_NAME" = pull_request ]; then
            git rev-parse --verify --quiet HEAD^2 > /dev/null || full "no merge commit"
          elif [ "$(git rev-parse HEAD^1)" != "$BEFORE" ]; then
            full "push does not start at the previous tip"
          fi
          git show HEAD^1:.github/scripts/ci_changes.py > "$RUNNER_TEMP/ci_changes.py" 2> /dev/null \
            || full "base commit has no classifier"
          python3 "$RUNNER_TEMP/ci_changes.py" classify --base HEAD^1 --head HEAD
      - name: Test the CI scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  docs:
    name: documentation checks
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Whitespace errors
        if: github.event_name != 'workflow_dispatch'
        run: git diff --check HEAD^1 HEAD
      - name: Links and anchors in changed Markdown
        if: github.event_name != 'workflow_dispatch'
        run: python3 .github/scripts/ci_changes.py check-docs --base HEAD^1 --head HEAD

  cpu:
    name: cpu (ubuntu-latest)
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: cpu
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: CPU libraries, tools, and facade without default features
        run: cargo xtask ci-cpu
      - name: Verify that no Markdown file is a build input
        run: python3 .github/scripts/ci_changes.py markdown-inputs --target target/validation --root .

  managed:
    name: managed (ubuntu-latest)
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: managed
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Required .NET build, native host, and managed lifecycle tests
        run: cargo xtask ci-managed
      - name: Verify that no Markdown file is a build input
        run: python3 .github/scripts/ci_changes.py markdown-inputs --target target/validation --root .

  gpu-static:
    name: gpu static checks
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: ./.github/actions/lavapipe
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lavapipe
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Lint, complexity, check, build and doctests for the GPU packages
        env:
          WGPU_BACKEND: vulkan
          WGPU_ADAPTER_NAME: llvmpipe
        run: xvfb-run --auto-servernum --server-args="-screen 0 8192x8192x24 -nolisten tcp" cargo xtask ci-gpu-static
      - name: Verify that no Markdown file is a build input
        run: python3 .github/scripts/ci_changes.py markdown-inputs --target target/validation --root .

  gpu-tests:
    name: gpu tests (${{ matrix.shard }}/8)
    needs: classify
    if: needs.classify.outputs.docs_only == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: ./.github/actions/lavapipe
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: lavapipe
          save-if: false
      - name: Required GPU tests, one eighth of the full suite
        env:
          WGPU_BACKEND: vulkan
          WGPU_ADAPTER_NAME: llvmpipe
        run: xvfb-run --auto-servernum --server-args="-screen 0 8192x8192x24 -nolisten tcp" cargo xtask ci-gpu-shard ${{ matrix.shard }}/8

  gate:
    name: PR gate
    needs: [classify, docs, cpu, managed, gpu-static, gpu-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A documentation-only change must skip every build job, and any other change must pass
      # every one. A skipped or cancelled job never counts as a pass for a code change.
      - name: Evaluate the required jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: python3 {0}
        run: |
          import json
          import os
          import sys

          needs = json.loads(os.environ["NEEDS"])
          builds = ["cpu", "managed", "gpu-static", "gpu-tests"]
          problems = []


          def result(name):
              return needs.get(name, {}).get("result")


          for name in ("classify", "docs"):
              if result(name) != "success":
                  problems.append(f"{name} finished as {result(name)!r}, expected 'success'")
          docs_only = needs.get("classify", {}).get("outputs", {}).get("docs_only")
          if docs_only not in ("true", "false"):
              problems.append(f"classify reported docs_only={docs_only!r}, expected 'true' or 'false'")
          else:
              expected = "skipped" if docs_only == "true" else "success"
              for name in builds:
                  if result(name) != expected:
                      problems.append(
                          f"{name} finished as {result(name)!r}, expected {expected!r} for docs_only={docs_only}"
                      )
          if problems:
              print("PR gate failed:")
              for problem in problems:
                  print(f"  - {problem}")
              sys.exit(1)
          print(f"PR gate passed (docs_only={docs_only})")

  report:
    name: report
    needs: [classify, docs, cpu, managed, gpu-static, gpu-tests]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Open, update or close the CI failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
          WORKFLOW: PR
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
        run: python3 .github/scripts/ci_report.py
