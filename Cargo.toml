[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
atomic-write-file = "0.3.0"
blake3 = "1.8.5"
csv = "1.4.0"
glam = { version = "0.33.2", features = ["serde"] }
png = "0.18.0"
pollster = "0.4.0"
postcard = { version = "1.1.3", features = ["alloc"] }
rustix = "1.1.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tempfile = "3.27.0"
thiserror = "2.0.17"
libloading = "0.8"
netcorehost = { version = "0.22", default-features = false, features = ["nethost", "nethost-download", "net8_0"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
uuid = { version = "1.19.0", features = ["serde", "v4"] }
wgpu = "30.0.0"
winit = "0.30.13"
zstd = "0.13.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
