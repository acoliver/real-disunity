[package]
name = "worldrunner-silent-wwise"
description = "A Wwise sound engine that plays nothing and reports zero for every call"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# The workspace forbids unsafe code. This library must export C symbols, and exporting a
# symbol is an unsafe attribute, so it takes the workspace's clippy policy without that one lint.
[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
