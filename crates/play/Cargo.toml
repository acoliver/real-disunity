[package]
name = "worldrunner-play"
description = "Plays the original Unity games in a window with scripted input and captures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
png.workspace = true
serde_json.workspace = true
thiserror.workspace = true
worldrunner-disunity-runtime = { path = "../disunity-runtime" }
worldrunner-original-games = { path = "../original-games" }
worldrunner-render-plan = { path = "../render-plan", features = ["simulation"] }
worldrunner-render-scene = { path = "../render-scene" }
worldrunner-scene-viewer = { path = "../scene-viewer" }
worldrunner-unity-import = { path = "../unity-import" }

[[bin]]
name = "play"
path = "src/main.rs"

[[test]]
name = "play_window"
harness = false

[lints]
workspace = true
