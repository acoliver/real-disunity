[package]
name = "worldrunner-scene-viewer"
description = "Optional desktop host for retained governed scenes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
worldrunner-camera = { path = "../camera" }
worldrunner-render-post = { path = "../render-post" }
worldrunner-render-gpu = { path = "../render-gpu" }
glam.workspace = true
pollster.workspace = true
thiserror.workspace = true
worldrunner-render-plan = { path = "../render-plan", features = ["ui"] }
worldrunner-world-simulation = { path = "../world-simulation", features = ["ui"] }
worldrunner-render-scene = { path = "../render-scene" }
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSProcessInfo", "NSString"] }

[dev-dependencies]
worldrunner-render-gpu = { path = "../render-gpu", features = ["test-support"] }

[[test]]
name = "callback_failure"
harness = false

[[test]]
name = "live_window"
harness = false

[[test]]
name = "presentation_budget"
harness = false

[[test]]
name = "adapter_frame"
harness = false

[lints]
workspace = true
