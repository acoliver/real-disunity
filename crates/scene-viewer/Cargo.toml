[package]
name = "worldrunner-scene-viewer"
description = "Optional desktop host for retained governed scenes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test constructors that make the GPU instance without `InstanceFlags::DEBUG`, for the tests of
# crates that drive the viewer.
test-support = ["worldrunner-render-gpu/test-support"]

[dependencies]
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }
accesskit = "=0.24.0"
accesskit_winit = { version = "=0.32.2", default-features = false, features = ["accesskit_unix", "async-io", "rwh_06"] }
worldrunner-camera = { path = "../camera" }
cpal.workspace = true
worldrunner-render-post = { path = "../render-post" }
worldrunner-render-gpu = { path = "../render-gpu" }
worldrunner-render-program = { path = "../render-program" }
glam.workspace = true
pollster.workspace = true
thiserror.workspace = true
worldrunner-render-plan = { path = "../render-plan", features = ["simulation"] }
worldrunner-world-simulation = { path = "../world-simulation", features = ["ui"] }
worldrunner-render-scene = { path = "../render-scene" }
wgpu.workspace = true
winit.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.5"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSProcessInfo", "NSString"] }

[dev-dependencies]
worldrunner-render-program = { path = "../render-program", features = ["unity"] }
worldrunner-render-scene = { path = "../render-scene", features = ["test-support"] }
worldrunner-render-gpu = { path = "../render-gpu", features = ["test-support"] }

[[test]]
name = "presentation_budget"
harness = false

[[test]]
name = "adapter_frame"
harness = false

[lints]
workspace = true
