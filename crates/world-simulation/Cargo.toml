[package]
name = "worldrunner-world-simulation"
description = "CPU-only typed live world storage and simulation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
ui = ["dep:ab_glyph", "dep:ttf-parser", "glam/u32"]

[dependencies]
ab_glyph = { version = "0.2.32", optional = true }
glam = { version = "0.33.2", default-features = false, features = ["std"] }
ttf-parser = { version = "0.25.1", optional = true }
thiserror.workspace = true

[lints]
workspace = true
