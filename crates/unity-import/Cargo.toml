[package]
name = "worldrunner-unity-import"
description = "Offline Unity scene, prefab and project content import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "unity-import"
path = "src/main.rs"

[dependencies]
jpeg-decoder = { version = "0.3.2", default-features = false }
naga = { version = "30.0.0", features = ["spv-in", "spv-out", "msl-out", "hlsl-out"] }
png.workspace = true
serde.workspace = true
serde_json.workspace = true
spirv-webgpu-transform = "0.1.7"
thiserror.workspace = true
worldrunner-unity-serialized = { path = "../unity-serialized" }

[dev-dependencies]
tempfile.workspace = true
worldrunner-original-games = { path = "../original-games" }

[lints]
workspace = true
