[package]
name = "worldrunner-play"
description = "Plays the original Unity games in a window with scripted input and captures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
glam.workspace = true
png.workspace = true
pollster.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wgpu.workspace = true
worldrunner-camera = { path = "../camera" }
worldrunner-disunity-runtime = { path = "../disunity-runtime" }
worldrunner-original-games = { path = "../original-games" }
worldrunner-render-gpu = { path = "../render-gpu" }
worldrunner-render-plan = { path = "../render-plan", features = ["simulation"] }
worldrunner-render-program = { path = "../render-program" }
worldrunner-render-scene = { path = "../render-scene" }
worldrunner-scene-viewer = { path = "../scene-viewer" }
worldrunner-unity-import = { path = "../unity-import" }
worldrunner-unity-serialized = { path = "../unity-serialized" }
worldrunner-world-simulation = { path = "../world-simulation" }

[dev-dependencies]
tempfile.workspace = true
worldrunner-render-gpu = { path = "../render-gpu", features = ["test-support"] }
worldrunner-render-program = { path = "../render-program", features = ["test-support"] }

[[bin]]
name = "play"
path = "src/main.rs"

[[test]]
name = "play_window"
harness = false

[lints]
workspace = true
