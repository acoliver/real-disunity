name: Software Vulkan
description: Installs lavapipe and an isolated X11 display, installs .NET, and selects lavapipe explicitly

runs:
  using: composite
  steps:
    # The live-window tests send real X11 key and focus events with xdotool, take focus
    # with an xmessage window (x11-utils) and pin the keymap with setxkbmap (x11-xkb-utils).
    # The play-window test draws Pong's score in Liberation Sans (fonts-liberation), the
    # metric-compatible stand-in for Unity's Arial.
    - name: Install software Vulkan implementation and isolated X11 display
      shell: bash
      run: sudo apt-get update && sudo apt-get install --yes mesa-vulkan-drivers vulkan-tools xvfb xauth libxkbcommon-x11-0 xdotool x11-utils x11-xkb-utils fonts-liberation fontconfig
    # The play-window test compiles the original games' scripts and the managed bridge.
    - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
      with:
        dotnet-version: 8.0.x
    - name: Select lavapipe explicitly and verify the device
      shell: bash
      run: |
        set -euo pipefail
        icd=/usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        if [ ! -f "$icd" ]; then icd=/usr/share/vulkan/icd.d/lvp_icd.json; fi
        test -f "$icd"
        echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"
        echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
        echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/vulkan-runtime" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/vulkan-runtime"
        chmod 700 "$RUNNER_TEMP/vulkan-runtime"
        VK_ICD_FILENAMES="$icd" VK_DRIVER_FILES="$icd" vulkaninfo --summary | tee "$RUNNER_TEMP/vulkan-device.txt"
        grep -Ei 'llvmpipe|lavapipe' "$RUNNER_TEMP/vulkan-device.txt"
