[package]
name = "worldrunner-disunity-ffi"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Disunity C ABI: versioned, append-only exports over engine-owned handle storage"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
worldrunner-camera = { path = "../camera" }
worldrunner-world-simulation = { path = "../world-simulation", features = ["ui"] }
glam.workspace = true

[build-dependencies]
csbindgen = "1.9.8"

[dev-dependencies]
serde_json.workspace = true

# The CI profiles run no separate complexity pass, so strict lint enforces the clippy.toml limits.
[lints.clippy]
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
struct_excessive_bools = "warn"
